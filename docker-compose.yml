version: "3.8"

services:
  web:
    build: .
    container_name: project-container
    ports:
      - "8080:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: schoolhelpdesk
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306" 